name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    # CodeQL's SARIF upload requires Code Scanning to be enabled for the
    # repository. On private repos that's a paid GHAS feature, so the upload
    # fails and the job goes red. Gating on public visibility makes this a
    # no-op while matcrawl is private; flipping the repo public re-enables
    # the scan automatically without a workflow edit.
    if: github.event.repository.visibility == 'public'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
